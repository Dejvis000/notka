name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Notka.sln -c Release -p:Platform=x64

      - name: Test
        run: dotnet test --solution Notka.sln -c Release --no-build --no-progress

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          dotnet publish src/Notka.Mcp -c Release -r win-x64 --self-contained -o artifacts/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Notka.Desktop -c Release -r win-x64 -p:Platform=x64 --self-contained -o artifacts/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($exe in "Notka.Desktop.exe", "Notka.Mcp.exe") {
            if (-not (Test-Path "artifacts/desktop/$exe")) { throw "$exe is missing from the package" }
          }
          Compress-Archive -Path artifacts/desktop/* -DestinationPath Notka-win-x64.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "release-notes/${{ github.ref_name }}.md"
          if (Test-Path $notes) {
            gh release create "${{ github.ref_name }}" Notka-win-x64.zip --title "${{ github.ref_name }}" --notes-file $notes
          } else {
            gh release create "${{ github.ref_name }}" Notka-win-x64.zip --generate-notes
          }
