name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Notka.sln -c Release -p:Platform=x64

      - name: Test
        run: dotnet test --solution Notka.sln -c Release --no-build --no-progress

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          dotnet publish src/Notka.Desktop -c Release -r win-x64 -p:Platform=x64 --self-contained -o artifacts/desktop
          dotnet publish src/Notka.Mcp -c Release -r win-x64 --self-contained -o artifacts/mcp
          Compress-Archive -Path artifacts/desktop/* -DestinationPath Notka-Desktop-win-x64.zip
          Compress-Archive -Path artifacts/mcp/* -DestinationPath Notka-Mcp-win-x64.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Notka-Desktop-win-x64.zip Notka-Mcp-win-x64.zip --generate-notes
